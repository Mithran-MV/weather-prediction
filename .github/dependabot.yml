version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem rather than a dozen — easier to review and revert.
      react:
        patterns:
          [
            'react',
            'react-dom',
            '@types/react',
            '@types/react-dom',
            'next',
            'eslint-config-next',
          ]
      dev-tooling:
        patterns:
          ['eslint*', 'prettier*', 'vitest', '@vitest/*', 'typescript', '@types/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
